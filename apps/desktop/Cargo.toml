[package]
name = "yonder-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
cc = "1"

[dependencies]
yonder-adapters = { path = "../../crates/adapters" }
yonder-application = { path = "../../crates/application" }
tauri = { version = "=2.11.5", features = ["tray-icon", "macos-private-api"] }
interprocess = { version = "=2.4.4", features = ["tokio"] }
tokio = { version = "=1.53.1", features = ["io-util", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWindow"] }
