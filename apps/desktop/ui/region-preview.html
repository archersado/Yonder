<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yonda · 圈选提问</title><link rel="stylesheet" href="region-preview.css" /><script src="region-preview.js" defer></script></head>
<body><main id="selector" aria-label="圈选提问"><div id="toolbar" role="group" aria-label="选择方式"><button id="rect-mode" aria-pressed="true"><i aria-hidden="true">□</i>框选</button><button id="stroke-mode" aria-pressed="false"><i aria-hidden="true">〰</i>画圈</button><span id="hint">拖动选择内容</span><button id="toolbar-cancel" aria-label="取消圈选">×</button></div><div id="selection" hidden></div><svg id="stroke" hidden aria-hidden="true"><polyline /></svg></main>
<section id="review" hidden aria-labelledby="review-title"><article><button id="close" aria-label="关闭">×</button><img id="preview" alt="所选屏幕区域预览" /><small>YONDA · 圈选提问</small><h1 id="review-title">已截取选区</h1><label for="question">想问什么？</label><textarea id="question" maxlength="16384" rows="3" placeholder="例如：帮我解释这部分内容"></textarea><p id="status" role="status">截图仅在本次发送期间保留。</p><div id="actions"><button id="again">重新圈选</button><button id="cancel">取消</button><button id="voice" aria-label="语音提问">🎙 语音</button><button id="send" disabled>发送</button></div></article></section></body></html>
