<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yonda · 圈选提问</title><link rel="stylesheet" href="region-preview.css" /><script src="region-preview.js" defer></script></head>
<body><main id="selector" aria-label="圈选提问"><p><button id="rect-mode" aria-pressed="true">框选</button><button id="stroke-mode" aria-pressed="false">笔画</button><span id="hint">拖动鼠标圈选内容，按 Esc 取消</span></p><div id="selection" hidden></div><svg id="stroke" hidden aria-hidden="true"><polyline /></svg></main>
<section id="review" hidden aria-labelledby="review-title"><article><button id="close" aria-label="关闭">×</button><small>YONDA · 圈选提问</small><h1 id="review-title">已截取选区</h1><img id="preview" alt="所选屏幕区域预览" /><p id="status">仅在本机内存预览；发送给 Agent 的功能待接入。</p><button id="again">重新圈选</button><button id="cancel">取消</button></article></section></body></html>
