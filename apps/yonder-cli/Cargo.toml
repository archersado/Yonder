[package]
name = "yonder-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "yonder"
path = "src/main.rs"

[dependencies]
yonder-protocol = { path = "../../crates/protocol" }
interprocess = { version = "=2.4.4", features = ["tokio"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "rt"] }
