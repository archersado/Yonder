[package]
name = "yonder-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "yonder"
path = "src/main.rs"

[dependencies]
yonder-protocol = { path = "../../crates/protocol" }
base64 = "=0.22.1"
interprocess = { version = "=2.4.4", features = ["tokio"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
