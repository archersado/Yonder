[package]
name = "yonder-adapters"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
yonder-application = { path = "../application" }
rusqlite = { version = "=0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "=0.42.0"
sha2 = "=0.10.9"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
yonder-protocol = { path = "../protocol" }
