[package]
name = "yonder-agent-desktop-v2-input-visibility"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[workspace]
resolver = "2"
