[package]
name = "yonder-agent-desktop-driver-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1.0"
libc = "0.2"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
agent-desktop-core = { path = "target/patched-agent-desktop/crates/core" }
agent-desktop-windows = { path = "target/patched-agent-desktop/crates/windows" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
agent-desktop-core = { path = "target/patched-agent-desktop/crates/core" }
agent-desktop-macos = { path = "target/patched-agent-desktop/crates/macos" }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

[[bin]]
name = "generate-schema"
path = "src/bin/generate-schema.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[[bin]]
name = "native-read-probe"
path = "src/bin/native-read-probe.rs"

[[bin]]
name = "native-lifecycle-probe"
path = "src/bin/native-lifecycle-probe.rs"

[[bin]]
name = "native-hwnd-reuse-probe"
path = "src/bin/native-hwnd-reuse-probe.rs"

[[bin]]
name = "native-identity01-read-probe"
path = "src/bin/native-identity01-read-probe.rs"

[[bin]]
name = "native-input-observer-probe"
path = "src/bin/native-input-observer-probe.rs"

[workspace]
resolver = "2"
exclude = ["target/patched-agent-desktop"]
