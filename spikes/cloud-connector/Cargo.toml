[package]
name = "cloud-connector-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
futures-util = "0.3"
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
